{% extends "dashboard/base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">

        <h2 class="fw-bold">

            Settings

        </h2>

        <p class="text-muted">

            Configure the AI platform.

        </p>

    </div>

    <div class="card">

        <div class="card-body">

            <form>

                <div class="row mb-4">

                    <div class="col-md-6">

                        <label class="form-label">

                            LLM Provider

                        </label>

                        <select class="form-select">

                            <option>

                                Google

                            </option>

                            <option>

                                OpenAI

                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Model

                        </label>

                        <input
                            class="form-control"
                            value="gemini-2.5-flash"
                        >

                    </div>

                </div>

                <div class="row mb-4">

                    <div class="col-md-4">

                        <label class="form-label">

                            Temperature

                        </label>

                        <input
                            type="number"
                            step="0.1"
                            class="form-control"
                            value="0.0"
                        >

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            Top K

                        </label>

                        <input
                            type="number"
                            class="form-control"
                            value="5"
                        >

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            Similarity Threshold

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            value="0.45"
                        >

                    </div>

                </div>

                <div class="row mb-4">

                    <div class="col-md-6">

                        <label class="form-label">

                            Chunk Size

                        </label>

                        <input
                            class="form-control"
                            value="700"
                        >

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Chunk Overlap

                        </label>

                        <input
                            class="form-control"
                            value="100"
                        >

                    </div>

                </div>

                <button
                    class="btn btn-primary"
                    type="button"
                >

                    <i class="bi bi-floppy"></i>

                    Save Settings

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
